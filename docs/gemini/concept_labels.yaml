# Display labels for every concept in 元健康 Meta-Health, per language.
# build_graphs_v1.py merges these into each node's `labels:` field in graph.yaml;
# spl/tools.py's localized_label() uses them for section headings, page titles
# and the book TOC. Without a label, the node id's title-case is used.
# One entry per concept id — a concept re-declared in a later chapter keeps
# the same label everywhere.

